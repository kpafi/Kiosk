services:
  kiosk:
    build: .
    # deploy.sh baut und startet mit KIOSK_IMAGE=kiosk:candidate und setzt kiosk:latest erst nach
    # dem Login-Test; ohne Variable (Neustart von Hand, Zurückrollen) gilt kiosk:latest.
    image: ${KIOSK_IMAGE:-kiosk:latest}
    container_name: kiosk
    # Eigene uid/gid (wie USER im Dockerfile). Auch hier gesetzt, damit ein älteres Image (kiosk:good,
    # kiosk:previous; dort noch uid 1000) nach dem Zurückrollen als 10100 läuft und das
    # Datenverzeichnis (gehört 10100, deploy.sh) weiter schreiben kann.
    user: "10100:10100"
    restart: unless-stopped
    # Kleiner init-Prozess als PID 1: sammelt verwaiste Prozesse ein (z. B. vom Pool getötete
    # Extraktions-Worker) und leitet Signale an uvicorn weiter.
    init: true
    env_file: .env
    ports:
      - "127.0.0.1:8100:8100"     # nur Loopback, Caddy macht HTTPS
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Speicher: bis zu 3 Worker-Prozesse gleichzeitig (2 Extraktion + 1 Feed-Parsing, app/fetcher.py),
    # jeder mit höchstens 320 MB Adressraum (JOB_MEMORY_LIMIT, setrlimit), zusammen 960 MB, dazu die
    # App selbst (uvicorn, SQLite-Cache, Geschichten; Reserve 320 MB) = 1280 MB. So trifft der
    # OOM-Killer des Containers nie die App, bevor ein Worker an seiner eigenen Grenze scheitert.
    # Üblich sind App ca. 200 MB und ein bis zwei Worker mit 100-200 MB; die Box (3,7 GB) teilen sich
    # Kiosk, secure-chat und MailDigest.
    mem_limit: 1280m
    pids_limit: 256
    cpus: "1.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Subnetz fest vorgeben: Der Container vertraut Proxy-Headern nur von 127.0.0.1 und 172.19.0.1
# (Dockerfile, --forwarded-allow-ips); Caddy kommt über docker-proxy vom Gateway 172.19.0.1.
# Entspricht dem bestehenden Netz kiosk_default auf der Box.
networks:
  default:
    ipam:
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1
