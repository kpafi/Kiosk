  - {id: zeit,         name: Die Zeit,                short: "ZEIT",          country: DE, lang: de, feed: "https://newsfeed.zeit.de/index",                        homepage: "https://www.zeit.de",          note: "Z+ Artikel werden als Paywall markiert"}
