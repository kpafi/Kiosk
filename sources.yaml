# Quellenkatalog für Kiosk.
# Alle Feeds wurden am 25.09.2026 vom Hetzner-Server aus getestet (Feed + Volltext-Extraktion),
# heise Security und GEA am 26.09.2026, FOCUS online am 28.09.2026.
# feed: RSS/Atom oder eine Google-News-Sitemap (urlset) bzw. ein Sitemap-Index, am Inhalt erkannt (GEA).
# include_paths: optionale Liste regulärer Ausdrücke; nur Einträge, deren URL-Pfad (ohne Query) auf
# einen davon passt (Python re.search), werden angelegt, z. B. nur die Lokalressorts einer Regionalzeitung.
# in_all: false holt die Quelle weiter und zeigt sie in ihrer eigenen Ansicht und in Profilen, die sie
# ausdrücklich nennen, aber nicht in ALLE, in Profilen ohne Quellenliste und in der Suche ohne Quelle.
# guid_pattern: optionaler regulärer Ausdruck mit genau einer Gruppe, auf die URL angewandt; die Gruppe
# ist die GUID (z. B. die Artikelnummer, damit ein geänderter Titel im URL-Slug kein Duplikat erzeugt).
# generated: true heißt, die Artikel entstehen in der App selbst (KI-Ausgabe, app/editions.py); feed darf dann
# leer sein, der Sammler überspringt die Quelle. Für alle anderen Quellen ist feed Pflicht.
# default_enabled: false bedeutet nur, dass die Quelle beim ersten Start aus ist; sie lässt sich in der App einschalten.
# Bewusst nicht aufgenommen: Boulevard (Bild, Sun, Daily Mail ...), reine Bezahlmedien ohne Gratisartikel (WSJ, FT, Economist, Nikkei),
# und Seiten, die Server-Zugriffe blocken (Politico, Axios, The Hill, France 24, RFI, Sky News, Washington Post, AP).
# Entfernt am 28.09.2026: CNN und PBS NewsHour (Feeds liefern keine aktuellen Einträge mehr). Artikel und
# Einstellungen entfernter Quellen bleiben in der Datenbank; die App überspringt Quellen, die nicht im Katalog stehen.

