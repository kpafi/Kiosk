# Quellenkatalog für Kiosk.
# Alle Feeds wurden am 25.09.2026 vom Hetzner-Server aus getestet (Feed + Volltext-Extraktion).
# default_enabled: false bedeutet nur, dass die Quelle beim ersten Start aus ist; sie lässt sich in der App einschalten.
# Bewusst nicht aufgenommen: Boulevard (Bild, Sun, Daily Mail ...), reine Bezahlmedien ohne Gratisartikel (WSJ, FT, Economist, Nikkei),
# und Seiten, die Server-Zugriffe blocken (Politico, Axios, The Hill, France 24, RFI, Sky News, Washington Post, AP).

