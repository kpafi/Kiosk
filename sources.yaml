  # GEA: Der RSS-Feed ist tot (Einträge von 2018), deshalb die News-Sitemap (Index, dessen Kind jedes
  # Quartal den Namen wechselt). Nur Regionales: Reutlingen, Neckar-Alb, Blaulicht (Polizeimeldungen
  # aus der Region), alle Ressorts auf „-in-der-region“ und der Sport außer „ueberregionaler-sport“
  # (Vereinsressorts wie sport/vfl-pfullingen, sport/tigers-tuebingen); nicht land (Baden-Württemberg),
  # welt* (Agenturmeldungen), Leserbriefe, weitere-nachrichten.
  - {id: gea,          name: Reutlinger General-Anzeiger, short: "GEA",       country: DE, lang: de, feed: "https://www.gea.de/sitemap-index/4-gea_de_-_news-sitemap.xml", homepage: "https://www.gea.de", note: "GEA+ Artikel werden als Paywall markiert; Feed ist die News-Sitemap",
     include_paths: ["^/reutlingen[^,]*_artikel,", "^/neckar-alb/[^,]*_artikel,", "^/blaulicht[^,]*_artikel,", "^/[^,]*-in-der-region_artikel,", "^/sport/(?!ueberregionaler)[^,]*_artikel,"],
     guid_pattern: '_arid,(\d+)'}
